<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Coach</title>
  <meta name="description" content="Personal training log, plan and progress tracker.">
  <meta name="theme-color" content="#101214">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="root" class="app" aria-live="polite">
    <div class="auth"><div class="eyebrow">Loading</div></div>
  </div>

  <nav class="tabbar hidden" id="tabbar" aria-label="Main">
    <div class="inner">
      <button class="tab" data-action="go-tab" data-tab="today" aria-label="Today">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/><path d="M9 14.5l2 2 4-4"/></svg><span>Today</span></button>
      <button class="tab" data-action="go-tab" data-tab="workout" aria-label="Workout">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11M2 12h1.5M20.5 12H22"/></svg><span>Log</span></button>
      <button class="tab" data-action="go-tab" data-tab="block" aria-label="Block">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span>Block</span></button>
      <button class="tab" data-action="go-tab" data-tab="progress" aria-label="Progress">
        <svg viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 14.5l4-4 3 3 5.5-6"/><path d="M15.5 7.5h4v4"/></svg><span>Progress</span></button>
      <button class="tab" data-action="go-tab" data-tab="coach" aria-label="Coach">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.5A8 8 0 1 1 21 12z"/><path d="M12 8.5v5M9.5 11h5"/></svg><span>Coach</span></button>
      <button class="tab" data-action="go-tab" data-tab="journal" aria-label="Journal">
        <svg viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v16.5H6.5A1.5 1.5 0 0 0 5 21z"/><path d="M5 19.5V4.5M9 8h6M9 12h6"/></svg><span>Journal</span></button>
      <button class="tab" data-action="go-tab" data-tab="health" aria-label="Health">
        <svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-5 4 10 2.5-5H21"/></svg><span>Health</span></button>
      <button class="tab" data-action="go-tab" data-tab="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M15 7a2 2 0 1 0 0 .01"/><path d="M4 12h3M11 12h9M9 12a2 2 0 1 0 0 .01"/><path d="M4 17h11M19 17h1M17 17a2 2 0 1 0 0 .01"/></svg><span>Settings</span></button>
    </div>
  </nav>

  <div class="timerbar" id="timerbar" role="timer">
    <div>
      <div class="time mono" id="timer-time">0:00</div>
      <div class="lbl" id="timer-label">Rest</div>
    </div>
    <div class="row" style="margin-left:auto">
      <button class="btn sm" id="timer-minus">&minus;30s</button>
      <button class="btn sm" id="timer-plus">+30s</button>
      <button class="btn sm" id="timer-skip">Skip</button>
    </div>
    <div class="track"><i id="timer-track"></i></div>
  </div>

  <div class="sheet-root" id="sheet-root">
    <div class="backdrop" id="sheet-backdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="grab"></div>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
