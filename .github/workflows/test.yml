name: test

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so the health check's repo finding reflects today's dependencies even
  # in a week with no pushes. This workflow holds no secrets.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
