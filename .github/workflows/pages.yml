name: pages

# The app is static: no build step, so the app/ directory is what ships.
# This workflow needs no secrets — the Supabase URL and anon key in
# app/js/config.js are public identifiers and access is enforced by RLS.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Checks the resolved value, not the source text: config.js names the
      # placeholder in the `configured` check itself, so a grep matches its own
      # guard and fails a perfectly good config.
      - name: Fail if the app still points at the placeholder project
        run: |
          node --input-type=module -e "
            import { configured } from './app/js/config.js';
            if (!configured) {
              console.error('app/js/config.js still holds the placeholder Supabase project.');
              process.exit(1);
            }
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
