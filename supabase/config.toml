project_id = "gym-coach"

[auth]
# One account, created by hand in the dashboard. Nobody else signs up.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[db]
major_version = 17

[functions.dispatch-job]
verify_jwt = true

# Called by the database (a pg_net trigger), which has no user token. The guard
# is the claim: the function only acts on a run that is still queued.
[functions.health-check]
verify_jwt = false

# Called by the signed-in app with its session token.
[functions.read-watch-shots]
verify_jwt = true
